  /personJob/person/{personId}/current:
    get:
      tags:
        - person-job-controller
      summary: Найти текущую должность сотрудника по его ID
      operationId: findPersonJobByPersonIdAndCurrent
      parameters:
        - name: personId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: ID сотрудника
          example: 5
      responses:
        200:
          description: Текущая должность сотрудника
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonJobResponse'
        400:
          $ref: '#/components/responses/400'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'

components:

  schemas:

    AcademicDegreesCreateRequest:
      type: object
      properties:
        name:
          type: string
          description: Название ученой степени
          example: "доктор наук"
        shortName:
          type: string
          description: Сокращенное название
          example: "д.н."
      required:
        - name

    AcademicDegreesUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/AcademicDegreesCreateRequest'
        - type: object
          properties:
            display:
              type: boolean
              default: true
              nullable: true

    AcademicDegreesResponse:
      allOf:
        - $ref: '#/components/schemas/AcademicDegreesCreateRequest'
        - type: object
          properties:
            id:
              type: integer
              format: int64
              description: ID учёной степени
          required:
            - id

    AcademicTitlesCreateRequest:
      type: object
      properties:
        name:
          type: string
          description: Название ученого звания
          example: "профессор"
        shortName:
          type: string
          description: Сокращенное название
          example: "проф."
      required:
        - name

    AcademicTitlesUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/AcademicTitlesCreateRequest'
        - type: object
          properties:
            display:
              type: boolean
              default: true
              nullable: true

    AcademicTitlesResponse:
      allOf:
        - $ref: '#/components/schemas/AcademicTitlesCreateRequest'
        - type: object
          properties:
            id:
              type: integer
              format: int64
              description: ID учёного звания
          required:
            - id

    Achievement:
      type: object
      properties:
        title:
          type: string
          description: Название достижения
          example: "Нобелевская премия"
        year:
          type: integer
          format: int32
          description: Год получения достижения
          example: 2020
        description:
          type: string
          description: Описание достижения
          example: "За открытие в области физики"
      required:
        - title

    AchievementResponse:
      allOf:
        - $ref: '#/components/schemas/Achievement'
        - type: object
          properties:
            id:
              type: integer
              format: int64
              description: ID достижения
          required:
            - id

    AchievementCreateRequest:
      allOf:
        - $ref: '#/components/schemas/Achievement'
        - type: object
          properties:
            personId:
              type: integer
              format: int64
              description: Идентификатор человека, связанного с достижением
              example: 5

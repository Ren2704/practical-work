      summary: Изменить информацию об ученом звании по ID
      operationId: updateAcademicTitle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademicTitlesUpdateRequest'
      responses:
        200:

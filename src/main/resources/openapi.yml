      summary: Изменить связующую запись по ID
      operationId: updatePersonJob
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonJobUpdateRequest'
      responses:

      summary: Найти все должности сотрудника по его ID
      operationId: findPersonJobByPersonId
      parameters:
        - name: personId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: ID сотрудника
          example: 5
      responses:
        200:
          description: Список должностей сотрудника
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonJobResponse'
        400:
          $ref: '#/components/responses/400'
        404:
          $ref: '#/components/responses/404'
        500:

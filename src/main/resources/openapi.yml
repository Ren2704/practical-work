components:

  schemas:

    AcademicDegreeCreateRequest:
      type: object
      properties:
        name:
          type: string
          description: Название ученой степени
          example: "доктор наук"
        shortName:
          type: string
          description: Сокращенное название
          example: "д.н."
      required:
        - name

    AcademicDegreeUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/AcademicDegreeCreateRequest'
        - type: object
          properties:
            isDeleted:
              type: boolean
              default: false
              nullable: true

    AcademicDegreeResponse:
      allOf:
        - $ref: '#/components/schemas/AcademicDegreeCreateRequest'
        - type: object
          properties:
            id:
              type: integer
              format: int64
              description: ID учёной степени
          required:
            - id

    AcademicTitleCreateRequest:
      type: object
      properties:
        name:
          type: string
          description: Название ученого звания
          example: "профессор"
        shortName:
          type: string
          description: Сокращенное название
          example: "проф."
      required:
        - name

    AcademicTitleUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/AcademicTitleCreateRequest'
        - type: object
          properties:
            isDeleted:
              type: boolean
              default: false
              nullable: true

    AcademicTitleResponse:
      allOf:
        - $ref: '#/components/schemas/AcademicTitleCreateRequest'
        - type: object
          properties:
            id:
              type: integer
              format: int64
              description: ID учёного звания
          required:
            - id

    Achievement:
      type: object
      properties:
        title:
          type: string
          description: Название достижения
          example: "Нобелевская премия"
        year:
          type: integer
          format: int32
          description: Год получения достижения
          example: 2020
        description:
          type: string
          description: Описание достижения
          example: "За открытие в области физики"
      required:
        - title

    AchievementResponse:
      allOf:
        - $ref: '#/components/schemas/Achievement'
        - type: object
          properties:
            id:
              type: integer
              format: int64
              description: ID достижения
          required:
            - id

    AchievementCreateRequest:
      allOf:
        - $ref: '#/components/schemas/Achievement'
        - type: object
          properties:
            personId:
              type: integer
              format: int64
              description: Идентификатор человека, связанного с достижением
              example: 5
          required:
            - personId

    AchievementUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/AchievementCreateRequest'
        - type: object
          properties:
            isDeleted:
              type: boolean
              default: false
              nullable: true

    EducationSubjectCreateRequest:
      type: object
      properties:
        name:
          type: string
          description: Название учебного предмета
          example: "экономика"
        shortName:
          type: string
          description: Сокращенное название предмета
          example: "эконом."
      required:
        - name

    EducationSubjectUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/EducationSubjectCreateRequest'
        - type: object
          properties:
            isDeleted:
              type: boolean
              default: false
              nullable: true

    EducationSubjectResponse:
      allOf:
        - $ref: '#/components/schemas/EducationSubjectCreateRequest'
        - type: object
          properties:
            id:
              type: integer
              format: int64
              description: ID научного направления
          required:
            - id

    JobTitleCreateRequest:
      type: object
      properties:
        name:
          type: string
          description: Название должности
          example: "директор"
      required:
        - name

    JobTitleUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/JobTitleCreateRequest'
        - type: object
          properties:
            isDeleted:
              type: boolean
              default: false
              nullable: true

    JobTitleResponse:
      allOf:
        - $ref: '#/components/schemas/JobTitleCreateRequest'
        - type: object
          properties:
            id:
              type: integer
              format: int64
              description: ID должности
          required:
            - id

    PersonResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: ID человека
        name:
          type: string
          description: Имя
        surname:
          type: string
          description: Фамилия
        patronymic:
          type: string
          description: Отчество
      required:
        - id
        - name
        - surname
        - patronymic

    OutstandingPersonResponse:
      allOf:
        - $ref: '#/components/schemas/PersonResponse'
        - type: object
          properties:
            gender:
              type: string
              enum: [ NOT_SELECTED, MALE, FEMALE ]
              description: Пол
            yearOfBirth:
              type: integer
              format: int32
              description: Год рождения
            yearOfDeath:
              type: integer
              format: int32
              description: Год смерти
            photoUrl:
              type: string
              description: URL фотографии
            biography:
              type: string
              description: Краткая биография
            academicDegree:
              allOf:
                - $ref: '#/components/schemas/AcademicDegreeResponse'
                - type: object
              nullable: true
              readOnly: true
            AcademicTitle:
              allOf:
                - $ref: '#/components/schemas/AcademicTitleResponse'
                - type: object
              nullable: true
              readOnly: true
            educationSubject:
              allOf:
                - $ref: '#/components/schemas/EducationSubjectResponse'
                - type: object
              nullable: true
              readOnly: true
            achievements:
              type: array
              items:
                $ref: '#/components/schemas/AchievementResponse'
              description: Список достижений
              readOnly: true
            jobs:
              type: array
              items:
                $ref: '#/components/schemas/PersonJobResponse'
              description: Список должностей
              readOnly: true

    OutstandingPersonCreateRequest:
      type: object
      properties:
        name:
          type: string
          description: Имя
          example: "Геннадий"
        surname:
          type: string
          description: Фамилия
          example: "Хацкевич"
        patronymic:
          type: string
          description: Отчество
          example: "Алексеевич"
        gender:
          type: string
          enum: [ NOT_SELECTED, MALE, FEMALE ]
          default: NOT_SELECTED
          description: Пол
          example: "MALE"
        yearOfBirth:
          type: integer
          format: int32
          description: Год рождения
          example: 1950
        yearOfDeath:
          type: integer
          format: int32
          nullable: true
          description: Год смерти
        photoUrl:
          type: string
          description: URL фотографии
        biography:
          type: string
          description: Краткая биография
        academicTitle:
          type: string
          nullable: true
          description: Название ученого звания
          example: "профессор"
        academicDegree:
          type: string
          nullable: true
          description: Название ученой степени
          example: "доктор"
        educationSubject:
          type: string
          nullable: true
          description: Название учебного предмета
          example: "экономика"
      required:
        - name
        - surname
        - patronymic

    OutstandingPersonUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/OutstandingPersonCreateRequest'
        - type: object
          properties:
            isDeleted:
              type: boolean
              default: false
              nullable: true

    PersonJobResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: ID записи
        jobTitle:
          allOf:
            - $ref: '#/components/schemas/JobTitleResponse'
            - type: object
          readOnly: true
        startYear:
          type: integer
          format: int32
          description: Год начала работы
        endYear:
          type: integer
          format: int32
          description: Год окончания работы
        current:
          type: boolean
          description: Является ли должность актуальной
      required:
          - id

    PersonJobCreateRequest:
      type: object
      properties:
        startYear:
          type: integer
          format: int32
          nullable: true
          description: Год начала работы
          example: 2010
        endYear:
          type: integer
          format: int32
          nullable: true
          description: Год окончания работы (не вводить, если должность актуальна)
        current:
          type: boolean
          default: false
          description: Является ли должность актуальной
          example: false
        personId:
          type: integer
          format: int64
          description: Идентификатор человека, к которому относится запись
          example: 1
        jobTitle:
          type: string
          description: Название должности
          example: "ректор"
      required:
        - personId
        - jobTitle

    PersonJobUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/PersonJobCreateRequest'
        - type: object
          properties:
            isDeleted:
              type: boolean
              default: false
              nullable: true

    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: ID пользователя
        login:
          type: string
          description: Логин пользователя
        role:
          type: string
          description: Роль пользователя
      required:
        - id
        - login
        - role

    UserCreateRequest:
      type: object
      properties:
        login:
          type: string
          maxLength: 50
          description: Логин пользователя
          example: "admin4"
        password:
          type: string
          maxLength: 100
          description: Пароль пользователя
          example: "admin4"
        role:
          type: string
          enum: [ NOT_SELECTED, ADMIN, EDITOR ]
          description: Роль пользователя
          default: NOT_SELECTED
          example: "ADMIN"
      required:
        - login
        - password

    UserUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/UserCreateRequest'
        - type: object

  responses:
    400:
      description: Некорректный запрос
    404:
      description: Ресурс не найден
    500:
      description: Внутренняя ошибка сервера
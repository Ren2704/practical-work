                $ref: '#/components/schemas/AchievementResponse'
        400:
          $ref: '#/components/responses/400'
        500:
          $ref: '#/components/responses/500'

  /achievements/{personId}:
    get:
      tags:
        - achievements-controller
      summary: Найти достижение по ID человека
      operationId: findByPersonId
      parameters:
        - name: personId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        200:
          description: Список достижений человека
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AchievementResponse'
        400:

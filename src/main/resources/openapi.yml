        400:
          $ref: '#/components/responses/400'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'

  /outstandingPeople/search/byName:
    get:
      tags:
        - outstanding-people-controller
      summary: Отобразить сотрудников по имени
      operationId: findOutstandingPersonByName
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
          description: Имя для поиска
          example: "Иван"
      responses:
        200:
          description: Список найденных выдающихся людей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OutstandingPeopleResponse'
        400:
          $ref: '#/components/responses/400'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'

  /outstandingPeople/search/bySurname:
    get:
      tags:
        - outstanding-people-controller
      summary: Отобразить сотрудников по фамилии
      operationId: findOutstandingPersonBySurname
      parameters:
        - name: surname
          in: query
          required: true
          schema:
            type: string
          description: Фамилия для поиска
          example: "Петров"
      responses:
        200:
          description: Список найденных выдающихся людей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OutstandingPeopleResponse'
        400:
          $ref: '#/components/responses/400'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'

  /outstandingPeople/search/byNameAndSurname:
    get:
      tags:
        - outstanding-people-controller
      summary: Отобразить сотрудника по имени и фамилии
      operationId: findOutstandingPersonByNameAndSurname
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
          description: Имя для поиска
          example: "Иван"
        - name: surname
          in: query
          required: true
          schema:
            type: string
          description: Фамилия для поиска
          example: "Петров"
      responses:
        200:
          description: Список найденных выдающихся людей
          content:
            application/json:
              schema:
                type: array
                items:

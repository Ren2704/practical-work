      summary: Создать новую должность
      operationId: createJobTitle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobTitleCreateRequest'
      responses:
        201:
          description: Должность успешно создана
          content:
            application/json:
              schema:

        400:
          $ref: '#/components/responses/400'
        500:
          $ref: '#/components/responses/500'

  /outstandingPeople/{id}:
    get:
      tags:
        - outstanding-people-controller
      summary: Отобразить сотрудника по его ID
      operationId: findOutstandingPersonById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        200:
          description: Найденный выдающийся человек
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutstandingPersonResponse'
        400:
          $ref: '#/components/responses/400'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'

    put:
      tags:
        - outstanding-people-controller
      summary: Изменить информацию о сотруднике по ID
      operationId: updateOutstandingPerson
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutstandingPersonUpdateRequest'
      responses:
        200:
          description: Запись успешно обновлена

    post:
      tags:
        - academic-titles-controller
      summary: Создать новое учёное звание
      operationId: createAcademicTitle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademicTitlesCreateRequest'
      responses:
        201:
          description: Ученое звание успешно создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicTitlesResponse'
        400:
          $ref: '#/components/responses/400'
        500:

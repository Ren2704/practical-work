components:

  schemas:

    AcademicDegreesResponse:
      type: object
      properties:
        name:
          type: string
          description: Название ученой степени
          example: "доктор наук"
        shortName:
          type: string
          description: Сокращенное название
          example: "д.н."
      required:
        - name

    AcademicDegreesCreateRequest:
      allOf:
        - $ref: '#/components/schemas/AcademicDegreesResponse'
        - type: object

    AcademicDegreesUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/AcademicDegreesCreateRequest'
        - type: object
          properties:
            id:
              type: integer
              format: int64
              description: Идентификатор ученой степени для обновления
              example: 1
          required:
            - id

    AcademicTitlesResponse:
      type: object
      properties:
        name:
          type: string
          description: Название ученого звания
          example: "профессор"
        shortName:
          type: string
          description: Сокращенное название
          example: "проф."
      required:
        - name

    AcademicTitlesCreateRequest:
      allOf:
        - $ref: '#/components/schemas/AcademicTitlesResponse'
        - type: object

    AcademicTitlesUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/AcademicTitlesCreateRequest'
        - type: object
          properties:
            id:
              type: integer
              format: int64
              description: Идентификатор ученого звания для обновления
              example: 1
          required:
            - id

    AchievementResponse:
      type: object
      properties:
        title:
          type: string
          description: Название достижения
          example: "Нобелевская премия"
        year:
          type: integer
          format: int32
          description: Год получения достижения
          example: 2020
        description:
          type: string
          description: Описание достижения
          example: "За открытие в области физики"
      required:
        - title

    AchievementCreateRequest:
      allOf:
        - $ref: '#/components/schemas/AchievementResponse'
        - type: object
          properties:
            personId:
              type: integer
              format: int64
              description: Идентификатор человека, связанного с достижением
              example: 5
          required:
            - personId

    AchievementUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/AchievementCreateRequest'
        - type: object
          properties:
            id:
              type: integer
              format: int64
              description: Идентификатор достижения для обновления
              example: 1
          required:
            - id

    EducationSubjectResponse:
      type: object
      properties:
        name:
          type: string
          description: Название учебного предмета
          example: "экономика"
        shortName:
          type: string
          description: Сокращенное название предмета
          example: "эконом."
      required:
        - name

    EducationSubjectCreateRequest:
      allOf:
        - $ref: '#/components/schemas/EducationSubjectResponse'
        - type: object

    EducationSubjectUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/EducationSubjectCreateRequest'
        - type: object
          properties:
            id:
              type: integer
              format: int64
              description: Идентификатор учебного предмета для обновления
              example: 1
          required:
            - id

    JobTitleResponse:
      type: object
      properties:
        name:
          type: string
          description: Название должности
          example: "директор"
      required:
        - name

    JobTitleCreateRequest:
      allOf:
        - $ref: '#/components/schemas/JobTitleResponse'
        - type: object

    JobTitleUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/JobTitleCreateRequest'
        - type: object
          properties:
            id:
              type: integer
              format: int64
              description: Идентификатор должности для обновления
              example: 1
          required:
            - id

    OutstandingPersonResponse:
      type: object
      properties:
        name:
          type: string
          description: Имя
        surname:
          type: string
          description: Фамилия
        patronymic:
          type: string
          description: Отчество
        gender:
          type: string
          enum: [ NOT_SELECTED, MALE, FEMALE ]
          description: Пол
        yearOfBirth:
          type: integer
          format: int32
          description: Год рождения
        yearOfDeath:
          type: integer
          format: int32
          description: Год смерти
        photoUrl:
          type: string
          description: URL фотографии
        biography:
          type: string
          description: Краткая биография
        academicDegree:
          allOf:
            - $ref: '#/components/schemas/AcademicDegreesResponse'
            - type: object
          nullable: true
          readOnly: true
        academicTitles:
          allOf:
            - $ref: '#/components/schemas/AcademicTitlesResponse'
            - type: object
          nullable: true
          readOnly: true
        educationSubject:
          allOf:
            - $ref: '#/components/schemas/EducationSubjectResponse'
            - type: object
          nullable: true
          readOnly: true
        achievements:
          type: array
          items:
            $ref: '#/components/schemas/AchievementResponse'
          description: Список достижений
          readOnly: true
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/PersonJobResponse'
          description: Список должностей
          readOnly: true
      required:
        - name
        - surname
        - patronymic

    OutstandingPersonCreateRequest:
      type: object
      properties:
        name:
          type: string
          description: Имя
          example: "Геннадий"
        surname:
          type: string
          description: Фамилия
          example: "Хацкевич"
        patronymic:
          type: string
          description: Отчество
          example: "Алексеевич"
        gender:
          type: string
          enum: [ NOT_SELECTED, MALE, FEMALE ]
          default: NOT_SELECTED
          description: Пол
          example: "MALE"
        yearOfBirth:
          type: integer
          format: int32
          description: Год рождения
          example: 1950
        yearOfDeath:
          type: integer
          format: int32
          nullable: true
          description: Год смерти
        photoUrl:
          type: string
          description: URL фотографии
        biography:
          type: string
          description: Краткая биография
        academicTitle:
          type: string
          nullable: true
          description: Название ученого звания
          example: "профессор"
        academicDegree:
          type: string
          nullable: true
          description: Название ученой степени
          example: "доктор"
        educationSubject:
          type: string
          nullable: true
          description: Название учебного предмета
          example: "экономика"
      required:
        - name
        - surname
        - patronymic

    OutstandingPersonUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/OutstandingPersonCreateRequest'
        - type: object
          properties:
            id:
              type: integer
              format: int64
              description: Идентификатор человека для обновления
              example: 1
          required:
            - id

    PersonJobResponse:
      type: object
      properties:
        jobTitle:
          allOf:
            - $ref: '#/components/schemas/JobTitleResponse'
            - type: object
          readOnly: true
        startYear:
          type: integer
          format: int32
          description: Год начала работы
        endYear:
          type: integer
          format: int32
          description: Год окончания работы
        current:
          type: boolean
          description: Является ли должность актуальной

    PersonJobCreateRequest:
      type: object
      properties:
        startYear:
          type: integer
          format: int32
          nullable: true
          description: Год начала работы
          example: 2010
        endYear:
          type: integer
          format: int32
          nullable: true
          description: Год окончания работы (не вводить, если должность актуальна)
        current:
          type: boolean
          default: false
          description: Является ли должность актуальной
          example: false
        personId:
          type: integer
          format: int64
          description: Идентификатор человека, к которому относится запись
          example: 1
        jobTitleId:
          type: integer
          format: int64
          description: Идентификатор названия должности, к которой относится запись
          example: 1
      required:
        - personId
        - jobTitleId

    PersonJobUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/PersonJobCreateRequest'
        - type: object
          properties:
            id:
              type: integer
              format: int64
              description: Идентификатор поля для обновления
              example: 1
          required:
            - id

    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Идентификатор пользователя
        login:
          type: string
          description: Логин пользователя
        role:
          type: string
          description: Роль пользователя
      required:
        - id
        - login
        - role

    UserCreateRequest:
      type: object
      properties:
        login:
          type: string
          maxLength: 50
          description: Логин пользователя
          example: "admin4"
        password:
          type: string
          maxLength: 100
          description: Пароль пользователя
          example: "admin4"
        role:
          type: string
          enum: [ NOT_SELECTED, ADMIN, EDITOR ]
          description: Роль пользователя
          default: NOT_SELECTED
          example: "ADMIN"
      required:
        - login
        - password

    UserUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/UserCreateRequest'
        - type: object
          properties:
            id:
              type: integer
              format: int64
              description: Идентификатор пользователя для обновления
              example: 1
          required:
            - id

  responses:
    200:
      description: Изменение информации о пользователе в базе данных
      content:
        application/json: { }
    400:
      description: Некорректный запрос
      content:
        application/json: { }
    500:
      description: Внутренняя ошибка сервера
      content:
        application/json: { }
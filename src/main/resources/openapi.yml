      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademicDegreesCreateRequest'
      responses:
        201:
          description: Ученая степень успешно создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicDegreesResponse'
        400:
          $ref: '#/components/responses/400'
        500:
          $ref: '#/components/responses/500'

  /academicDegrees/{id}:
    put:
      tags:
        - academic-degrees-controller
      summary: Изменить информацию об ученой степени  по ID
      operationId: updateAcademicDegree
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        required: true
        content:

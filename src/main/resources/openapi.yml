  /personJob:
    post:
      tags:
        - person-job-controller
      summary: Создать новую связующую запись сотрудник-должность
      operationId: createPersonJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonJobCreateRequest'
      responses:
        201:
